name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:
          # keep the matrix small: oldest and newest on Linux, one each elsewhere
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tools tests

      - name: Test
        run: pytest -q

      - name: Validate bundled manifests
        run: python -m steamverify doctor

      - name: Smoke-test the CLI (English)
        run: |
          python -m steamverify list
          python -m steamverify info --game witcher3

      - name: Smoke-test the CLI (Chinese)
        run: |
          python -m steamverify --lang zh list
          python -m steamverify --lang zh info --game witcher3
          python -m steamverify --lang zh doctor

      - name: Help text is localised
        run: |
          python -m steamverify --help
          python -m steamverify --lang zh --help

      - name: Machine output ignores --lang
        shell: bash
        run: |
          # Scan an empty directory: the shape of the output is what matters
          # here, not whether a game is installed on the runner.
          mkdir -p empty-game
          python -m steamverify verify --game witcher3 --no-hash --quiet \
            --json --dir empty-game > en.json || true
          python -m steamverify --lang zh verify --game witcher3 --no-hash --quiet \
            --json --dir empty-game > zh.json || true
          python - <<'PY'
          import json, sys

          en = json.load(open("en.json", encoding="utf-8"))["summary"]
          zh = json.load(open("zh.json", encoding="utf-8"))["summary"]
          for volatile in ("scanned_utc", "elapsed_seconds", "root", "directory"):
              en.pop(volatile, None)
              zh.pop(volatile, None)
          if en != zh:
              print("JSON differs between languages:")
              print(" en:", en)
              print(" zh:", zh)
              sys.exit(1)
          print("machine output is language-independent")
          PY

  reproducibility:
    name: manifests are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Every registry digest must match its manifest file
        run: |
          python - <<'PY'
          import sys
          from steamverify.registry import Registry

          problems = Registry.load().verify_all()
          for problem in problems:
              print("PROBLEM:", problem)
          sys.exit(1 if problems else 0)
          PY
