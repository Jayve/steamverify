name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:
          # keep the matrix small: oldest and newest on Linux, one each elsewhere
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tools tests

      - name: Test
        run: pytest -q

      - name: Validate bundled manifests
        run: python -m steamverify doctor

      - name: Smoke-test the CLI
        run: |
          python -m steamverify list
          python -m steamverify info --game witcher3

  reproducibility:
    name: manifests are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Every registry digest must match its manifest file
        run: |
          python - <<'PY'
          import sys
          from steamverify.registry import Registry

          problems = Registry.load().verify_all()
          for problem in problems:
              print("PROBLEM:", problem)
          sys.exit(1 if problems else 0)
          PY
